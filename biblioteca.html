<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog Bibliotecă</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1c222b;
      --muted: #5c6675;
      --accent: #1f4e78;
      --border: #dfe4ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      color: var(--accent);
    }
    .admin-link {
      padding: 10px 14px;
      border-radius: 6px;
      color: #fff;
      background: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }
    .stats {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .inv {
      font-size: 12px;
      font-weight: bold;
      color: var(--accent);
    }
    .titlu {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.3;
    }
    .autor {
      font-size: 14px;
      color: var(--muted);
    }
    .meta {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid #eef1f5;
      font-size: 12px;
      color: var(--muted);
    }
    @media (max-width: 650px) {
      .controls { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Catalog Bibliotecă</h1>
      <a class="admin-link" href="/admin">Intră ca administrator</a>
    </div>

    <div class="controls">
      <input id="searchInput" type="text" placeholder="Caută după titlu sau autor..." />
      <select id="sectionSelect">
        <option value="ALL">Toate secțiunile</option>
      </select>
    </div>

    <div id="stats" class="stats">Se încarcă datele...</div>
    <div id="results" class="grid"></div>
  </div>

  <script>
    let toateCartile = [];

    const searchInput = document.getElementById("searchInput");
    const sectionSelect = document.getElementById("sectionSelect");
    const statsEl = document.getElementById("stats");
    const resultsEl = document.getElementById("results");
    const adminLink = document.querySelector(".admin-link");
    const verificareAdmin = fetch("/api/session")
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (data && data.admin_available) {
          if (data.authenticated) adminLink.textContent = "Panou administrator";
          return true;
        }
        return false;
      })
      .catch(error => {
        console.error("Nu pot verifica disponibilitatea administrării.", error);
        return false;
      });

    adminLink.addEventListener("click", async event => {
      event.preventDefault();
      if (await verificareAdmin) {
        window.location.assign(adminLink.href);
      } else {
        alert("Administrarea nu este disponibilă pe acest site static. Pornește aplicația locală și deschide http://127.0.0.1:5000 pentru a te conecta.");
      }
    });

    function normalizeaza(str) {
      return (str || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function populeazaSectiuni(carti) {
      const sectiuni = [...new Set(carti.map(c => c.sectiune))].sort();
      for (const s of sectiuni) {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        sectionSelect.appendChild(opt);
      }
    }

    function randeaza(lista) {
      statsEl.textContent = `Afișate: ${lista.length} din ${toateCartile.length} intrări`;
      if (lista.length === 0) {
        const mesaj = document.createElement("p");
        mesaj.textContent = "Nu s-a găsit nicio carte conform filtrului.";
        resultsEl.replaceChildren(mesaj);
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const carte of lista) {
        const card = document.createElement("article");
        card.className = "card";

        const inventar = document.createElement("div");
        inventar.className = "inv";
        inventar.textContent = `${carte.nr_inv} • ${carte.sectiune}`;

        const titlu = document.createElement("div");
        titlu.className = "titlu";
        titlu.textContent = carte.titlu;

        const autor = document.createElement("div");
        autor.className = "autor";
        autor.textContent = carte.autor;

        const meta = document.createElement("div");
        meta.className = "meta";
        for (const [eticheta, valoare] of [
          ["An: ", carte.an],
          [" | Editură: ", carte.editura],
          [" | Localizare: ", carte.raft],
          [" | Ex.: ", carte.exemplare]
        ]) {
          meta.append(document.createTextNode(eticheta));
          const strong = document.createElement("strong");
          strong.textContent = valoare;
          meta.append(strong);
        }

        card.append(inventar, titlu, autor, meta);
        fragment.append(card);
      }
      resultsEl.replaceChildren(fragment);
    }

    function filtreaza() {
      const q = normalizeaza(searchInput.value.trim());
      const sec = sectionSelect.value;

      if (!q) {
        statsEl.textContent = "Introdu un titlu sau un autor pentru a căuta în catalog.";
        resultsEl.replaceChildren();
        return;
      }

      const filtrate = toateCartile.filter(c => {
        const potrivesteSectiune = (sec === "ALL") || (c.sectiune === sec);
        if (!potrivesteSectiune) return false;

        const textCautabil = normalizeaza(`${c.titlu} ${c.autor}`);
        return textCautabil.includes(q);
      });

      randeaza(filtrate);
    }

    const sursaDate = window.location.port === "5000" ? "/api/carti" : "data/carti.json";

    fetch(sursaDate)
      .then(res => {
        if (!res.ok) throw new Error("Nu pot încărca datele catalogului");
        return res.json();
      })
      .then(data => {
        const carti = Array.isArray(data) ? data : data.carti;
        if (!Array.isArray(carti)) throw new Error("Formatul datelor catalogului nu este valid.");
        toateCartile = carti;
        populeazaSectiuni(toateCartile);
        filtreaza();
      })
      .catch(err => {
        statsEl.textContent = `Eroare la încărcarea catalogului: ${err.message}. Pornește un server local (ex: python -m http.server) în folderul site-ului.`;
        console.error(err);
      });

    searchInput.addEventListener("input", filtreaza);
    sectionSelect.addEventListener("change", filtreaza);
  </script>
</body>
</html>
